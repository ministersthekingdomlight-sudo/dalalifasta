<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e8f80">
  <title>Arifa na Matangazo - DalaliFasta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --brand: #0e8f80;
      --brand-dark: #0a6b60;
      --ink: #14201e;
      --muted: #6b7a77;
      --line: #e6ecea;
      --bg: #f8fafc;
      --surface: #ffffff;
      --danger: #dc2626;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }
    a { color: inherit; text-decoration: none; }

    header {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .navbar {
      max-width: 800px; margin: 0 auto;
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; color: var(--ink); }
    .brand span { color: var(--brand); }
    .back-btn { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 600; }

    .main-container {
      max-width: 800px; width: 100%; margin: 0 auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .notifications-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notification-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 5px solid var(--brand);
      padding: 18px;
      border-radius: var(--radius);
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s;
    }
    .notification-card:hover { transform: translateY(-2px); }

    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notif-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notif-time {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 500;
    }

    .notif-body {
      font-size: 13.5px;
      color: #334155;
      line-height: 1.6;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 14px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--line);
    }
    .empty-state i { font-size: 36px; color: #cbd5e1; margin-bottom: 12px; display: block; }

    /* Bottom tab bar for mobile */
    .tabbar {
      position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 1200; max-width: 460px; margin: 0 auto;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-radius: 999px; padding: 8px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--line);
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 4px; border-radius: 999px;
      font-size: 10.5px; font-weight: 500; color: var(--muted);
    }
    .tab svg { width: 22px; height: 22px; }
    .tab.active { background: var(--brand); color: #fff; }

    @media (min-width: 900px) {
      body { padding-bottom: 0; }
      .tabbar { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="navbar">
      <a href="index.html" class="brand">
        Dalali<span>Fasta</span>
      </a>
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Rudi Nyumbani</a>
    </div>
  </header>

  <main class="main-container">
    <div>
      <div class="page-title"><i class="fa-solid fa-bell" style="color: var(--brand);"></i> Arifa na Matangazo</div>
      <p style="font-size: 13px; color: var(--muted);">Taarifa na matangazo yote muhimu kutoka kwa Uongozi wa DalaliFasta.</p>
    </div>

    <div id="notifications-feed" class="notifications-list">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        Inapakia arifa...
      </div>
    </div>
  </main>

  <nav class="tabbar" aria-label="Menyu kuu">
    <a href="index.html" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Nyumbani
    </a>
    <a href="videos.html" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Video
    </a>
    <a href="map.html" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      Ramani
    </a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://fwpzpihwxylnyejthnxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cHpwaWh3eHlsbnllanRobnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE2ODAsImV4cCI6MjEwNzA1NzY4MH0.SMaJxy35YVHs4_Lj1C4v72V069CJEypvxsBhjC65h6I';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadClientNotifications() {
      const container = document.getElementById('notifications-feed');
      const { data, error } = await supabaseClient
        .from('notifications')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-bell-slash"></i>
            Hakuna arifa au matangazo yaliyowekwa kwa sasa.
          </div>
        `;
        return;
      }

      container.innerHTML = data.map(notif => {
        const timeAgo = notif.created_at ? new Date(notif.created_at).toLocaleString('sw-TZ') : 'Hivi karibuni';
        return `
          <div class="notification-card" id="client-notif-${notif.id}">
            <div class="notif-header">
              <div class="notif-title"><i class="fa-solid fa-bullhorn" style="color: var(--brand);"></i> ${esc(notif.title)}</div>
              <div class="notif-time"><i class="fa-regular fa-clock"></i> ${timeAgo}</div>
            </div>
            <div class="notif-body">${esc(notif.message)}</div>
          </div>
        `;
      }).join('');
    }

    // Kusikiliza mabadiliko ya Live (Realtime) - Ikitokea ujumbe umeongezwa au kufutwa upande wa admin, utajirekebisha hapa mara moja
    function setupRealtimeFeed() {
      supabaseClient
        .channel('public:notifications')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications' }, payload => {
          loadClientNotifications();
        })
        .subscribe();
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    loadClientNotifications();
    setupRealtimeFeed();
  </script>
</body>
</html>
