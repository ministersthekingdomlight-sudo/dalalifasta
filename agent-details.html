<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e8f80">
  <title>Wasifu wa Dalali - DalaliFasta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --brand: #0e8f80;
      --brand-dark: #0a6b60;
      --brand-soft: #e3f4f1;
      --ink: #14201e;
      --muted: #6b7a77;
      --line: #e6ecea;
      --bg: #f4f7f6;
      --card: #ffffff;
      --gold: #ffb300;
      --radius: 24px;
      --container-max: 1000px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 40px;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; }

    header {
      background: rgba(244,247,246,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(230,236,234,0.6);
      position: sticky; top: 0; z-index: 100;
    }
    .navbar {
      max-width: var(--container-max); margin: 0 auto;
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .header-logo-img { width: 40px; height: 40px; object-fit: contain; border-radius: 12px; background: #fff; }
    .logo-text { font-size: 17px; font-weight: 700; }
    .logo-text span { color: var(--brand); }

    .container {
      max-width: var(--container-max); margin: 24px auto 0; padding: 0 18px;
    }

    .agent-header-card {
      background: var(--card); border-radius: var(--radius);
      padding: 24px; box-shadow: 0 6px 22px rgba(20,32,30,.07);
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px;
    }
    .agent-avatar-lg {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
      background: var(--brand); color: #fff; font-size: 36px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      box-shadow: 0 8px 20px rgba(14,143,128,0.25);
    }
    .agent-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .agent-name-lg { font-size: 22px; font-weight: 700; color: var(--ink); }
    .agent-meta { font-size: 14px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    
    .whatsapp-btn {
      background: #25d366; color: #fff; padding: 12px 24px; border-radius: 999px;
      font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 14px rgba(37,211,102,0.3); transition: transform 0.2s;
    }
    .whatsapp-btn:hover { transform: translateY(-2px); }

    .section-title { font-size: 18px; font-weight: 600; margin: 30px 0 14px; }
    .property-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }

    .property-card {
      background: var(--card); border-radius: var(--radius);
      padding: 10px; box-shadow: 0 6px 22px rgba(20,32,30,.07);
      display: flex; flex-direction: column;
    }
    .property-img-wrapper {
      position: relative; height: 200px; border-radius: 18px; overflow: hidden; background: #dfe8e6; display: block;
    }
    .property-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .property-details { padding: 12px 8px 6px; }
    .property-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .property-price { font-size: 18px; font-weight: 700; color: var(--brand-dark); }
    
    .status-box { background: var(--card); padding: 40px 20px; border-radius: var(--radius); text-align: center; box-shadow: 0 6px 22px rgba(20,32,30,.07); }
    .back-home-btn {
      background: var(--brand); color: #fff; padding: 10px 22px; border-radius: 999px;
      font-weight: 600; display: inline-block; margin-top: 14px;
    }

    @media (min-width: 640px) {
      .property-grid { grid-template-columns: repeat(2, 1fr); }
      .agent-header-card { flex-direction: row; text-align: left; justify-content: flex-start; }
    }
    @media (min-width: 900px) {
      .property-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <header>
    <div class="navbar">
      <a href="index_2.html" class="brand">
        <img src="download (9).jfif" alt="Logo" class="header-logo-img" onerror="this.src='https://via.placeholder.com/40?text=Logo'">
        <div class="logo-text">Dalali<span>Fasta</span></div>
      </a>
      <a href="index_2.html" style="font-size: 14px; font-weight: 600; color: var(--brand);">← Rudi Nyumbani</a>
    </div>
  </header>

  <main class="container">
    <div id="agentProfileContainer">
      <div class="status-box">Inapakia taarifa za dalali...</div>
    </div>

    <h2 class="section-title">Mali zilizowekwa na dalali huyu</h2>
    <div id="agentPropertiesGrid" class="property-grid">
      <div class="status-box" style="grid-column: 1/-1;">Inasubiri kupakia mali...</div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://fwpzpihwxylnyejthnxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cHpwaWh3eHlsbnllanRobnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE2ODAsImV4cCI6MjEwNzA1NzY4MH0.SMaJxy35YVHs4_Lj1C4v72V069CJEypvxsBhjC65h6I';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const FALLBACK_IMG = 'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=600';

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadAgentDetails(agentId) {
      const profileContainer = document.getElementById('agentProfileContainer');
      const propertiesGrid = document.getElementById('agentPropertiesGrid');

      // 1. Tafuta taarifa za dalali
      const { data: agent, error: agentError } = await supabaseClient
        .from('agents')
        .select('*')
        .eq('id', agentId)
        .single();

      if (agentError || !agent) {
        profileContainer.innerHTML = `
          <div class="status-box">
            <h3>Samahani</h3>
            <p style="color:var(--muted); margin-top:8px;">Hatukuweza kupata taarifa za dalali huyu kwenye mfumo.</p>
            <a href="index_2.html" class="back-home-btn">Rudi Nyumbani</a>
          </div>
        `;
        propertiesGrid.innerHTML = '';
        return;
      }

      const avatarContent = agent.avatar_url 
        ? `<img src="${esc(agent.avatar_url)}" alt="${esc(agent.full_name)}">`
        : esc((agent.full_name || 'D').charAt(0).toUpperCase());

      const cleanPhone = (agent.phone_number || '').replace(/[^0-9]/g, '');
      const whatsappUrl = cleanPhone ? `https://wa.me/${cleanPhone}?text=Habari%20${encodeURIComponent(agent.full_name)},%20nimeona%20mali%20zako kupitia DalaliFasta.` : '#';

      profileContainer.innerHTML = `
        <div class="agent-header-card">
          <div class="agent-avatar-lg">${avatarContent}</div>
          <div>
            <div class="agent-name-lg">${esc(agent.full_name || 'Dalali')}</div>
            <div class="agent-meta" style="margin: 6px 0 14px;">
              <span>📞 ${esc(agent.phone_number || 'Haijawekwa')}</span>
              <span>📍 ${esc(agent.location || 'Tanzania')}</span>
            </div>
            ${cleanPhone ? `<a href="${whatsappUrl}" target="_blank" class="whatsapp-btn">Wasiliana kupitia WhatsApp</a>` : ''}
          </div>
        </div>
      `;

      // 2. Tafuta mali zote za huyu dalali
      const { data: properties, error: propError } = await supabaseClient
        .from('properties')
        .select('*')
        .eq('agent_id', agentId)
        .order('created_at', { ascending: false });

      if (propError || !properties || properties.length === 0) {
        propertiesGrid.innerHTML = `<div class="status-box" style="grid-column: 1/-1; color:var(--muted);">Dalali huyu hana mali zilizowekwa kwa sasa.</div>`;
        return;
      }

      propertiesGrid.innerHTML = properties.map(item => {
        const imgUrl = item.image_url || (Array.isArray(item.images) && item.images[0]) || FALLBACK_IMG;
        return `
          <div class="property-card">
            <a href="property-details.html?id=${encodeURIComponent(item.id)}" class="property-img-wrapper">
              <img src="${esc(imgUrl)}" alt="${esc(item.title)}" loading="lazy" onerror="this.src='${FALLBACK_IMG}'">
            </a>
            <div class="property-details">
              <div class="property-title">${esc(item.title)}</div>
              <div class="property-price">Tsh ${Number(item.price || 0).toLocaleString()}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const agentId = urlParams.get('id');

      if (!agentId) {
        document.getElementById('agentProfileContainer').innerHTML = `
          <div class="status-box">
            <h3>Kitambulisho Hakipo</h3>
            <p style="color:var(--muted); margin: 8px 0;">Tafadhali chagua dalali kutoka ukurasa mkuu.</p>
            <a href="index_2.html" class="back-home-btn">Rudi Nyumbani</a>
          </div>
        `;
        document.getElementById('agentPropertiesGrid').innerHTML = '';
        return;
      }

      loadAgentDetails(agentId);
    });
  </script>
</body>
</html>
