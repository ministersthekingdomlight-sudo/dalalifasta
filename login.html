<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e8f80">
  <title>Ingia Dalali - DalaliFasta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --brand: #0e8f80;
      --brand-dark: #0a6b60;
      --brand-soft: #e3f4f1;
      --ink: #14201e;
      --muted: #6b7a77;
      --line: #e6ecea;
      --bg: #f4f7f6;
      --card: #ffffff;
      --danger: #e53935;
      --radius: 26px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: 0 12px 35px rgba(20, 32, 30, 0.08);
      border: 1px solid var(--line);
    }
    .brand-top { text-align: center; margin-bottom: 24px; }
    .brand-top h1 { font-size: 26px; font-weight: 800; }
    .brand-top h1 span { color: var(--brand); }
    .brand-top p { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      background: var(--bg);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .form-control:focus {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 4px var(--brand-soft);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 8px 20px rgba(14, 143, 128, 0.25);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    #status-msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .err { display: block !important; background: #ffebee; color: var(--danger); }
    .ok { display: block !important; background: #e8f5e9; color: #2e7d32; }
    .load { display: block !important; background: var(--brand-soft); color: var(--brand-dark); }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .auth-footer a { color: var(--brand); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-top">
      <h1>Dalali<span>Fasta</span></h1>
      <p>Ingia kwenye dashibodi yako ya udalali</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Namba ya Simu</label>
        <input type="tel" id="phoneInput" class="form-control" placeholder="0712345678" required>
      </div>

      <div class="form-group">
        <label class="form-label">Nenosiri (Password)</label>
        <input type="password" id="passwordInput" class="form-control" placeholder="Ingiza nenosiri lako" required>
      </div>

      <button type="submit" id="loginBtn" class="btn-submit">Ingia Kwenye Dashibodi</button>
    </form>

    <div id="status-msg"></div>

    <div class="auth-footer">
      Bado hujajisajili? <a href="register.html">Fungua Akaunti Hapa</a><br><br>
      <a href="index.html" style="color:var(--muted); font-weight:500;">← Rudi Nyumbani</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fwpzpihwxylnyejthnxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cHpwaWh3eHlsbnllanRobnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE2ODAsImV4cCI6MjEwNzA1NzY4MH0.SMaJxy35YVHs4_Lj1C4v72V069CJEypvxsBhjC65h6I';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    if (localStorage.getItem('dalali_user')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status-msg');
      const btn = document.getElementById('loginBtn');
      const phone = document.getElementById('phoneInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      status.className = 'load';
      status.innerText = '⏳ Inakagua taarifa zako...';
      btn.disabled = true;

      try {
        const { data: agent, error } = await supabaseClient
          .from('agents')
          .select('*')
          .eq('phone_number', phone)
          .eq('password', password)
          .maybeSingle();

        if (error) throw error;

        if (!agent) {
          throw new Error('Namba ya simu au nenosiri si sahihi. Kama hujajisajili, tafadhali jisajili kwanza.');
        }

        localStorage.setItem('dalali_user', JSON.stringify(agent));
        status.className = 'ok';
        status.innerText = '✅ Karibu ' + agent.full_name + '! Unapelekwa dashibodi...';

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);

      } catch (err) {
        status.className = 'err';
        status.innerText = '❌ ' + err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
