<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat na Dalali - DalaliFasta</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --brand: #0e8f80;
      --brand-dark: #0a6b60;
      --bg: #f4f7f6;
      --card: #ffffff;
      --ink: #14201e;
      --muted: #6b7a77;
      --line: #e6ecea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
    .navbar { max-width: 800px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .back-link { font-size: 14px; font-weight: 600; color: var(--brand); text-decoration: none; }
    .chat-wrapper { max-width: 800px; width: 100%; margin: 20px auto; padding: 0 16px; flex: 1; display: flex; flex-direction: column; }
    .chat-container { background: var(--card); border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); display: flex; flex-direction: column; height: 75vh; border: 1px solid var(--line); overflow: hidden; }
    .chat-header { background: var(--brand); color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .agent-avatar { width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--brand); display: grid; place-items: center; font-weight: 700; }
    .agent-info h3 { font-size: 15px; font-weight: 600; }
    .agent-info span { font-size: 11.5px; opacity: 0.9; display: block; }
    .chat-messages { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafcfc; }
    .chat-msg { max-width: 78%; padding: 12px 16px; border-radius: 16px; font-size: 13.5px; line-height: 1.5; }
    .chat-msg.client { background: var(--brand); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-msg.agent { background: #e3f4f1; color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-input-box { padding: 14px; background: #fff; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
    .chat-input { flex: 1; padding: 12px 18px; border: 1.5px solid var(--line); border-radius: 999px; outline: none; font-size: 14px; }
    .chat-input:focus { border-color: var(--brand); }
    .chat-send-btn { background: var(--brand); color: #fff; width: 45px; height: 45px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; border: none; }
    .chat-send-btn:hover { background: var(--brand-dark); }
  </style>
</head>
<body>

  <header>
    <div class="navbar">
      <a href="index.html" class="back-link">← Rudi Nyumbani</a>
      <div style="font-weight: 600; font-size: 14px;" id="propertyTitleHeader">DalaliFasta Chat</div>
    </div>
  </header>

  <main class="chat-wrapper">
    <div class="chat-container">
      <div class="chat-header">
        <div class="agent-avatar" id="agentAvatar">D</div>
        <div class="agent-info">
          <h3 id="agentName">Inatafuta Dalali...</h3>
          <span id="agentStatus">Supabase Live Connected</span>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg agent">Habari! Unazungumza na dalali wa mali hii kupitia mfumo salama wa Supabase. Andika ujumbe wako.</div>
      </div>

      <form class="chat-input-box" id="chatForm" onsubmit="sendChatMessage(event)">
        <input type="text" id="chatInput" class="chat-input" placeholder="Andika ujumbe wako hapa..." required autocomplete="off">
        <button type="submit" class="chat-send-btn">➤</button>
      </form>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://fwpzpihwxylnyejthnxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cHpwaWh3eHlsbnllanRobnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE2ODAsImV4cCI6MjEwNzA1NzY4MH0.SMaJxy35YVHs4_Lj1C4v72V069CJEypvxsBhjC65h6I';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const agentId = urlParams.get('agent_id') || 'general';
    const agentName = urlParams.get('agent_name') || 'Dalali Mtaalam';
    const propertyTitle = urlParams.get('property_title') || 'Mali ya Kupanga/Inauzwa';

    // Weka taarifa za dalali na nyumba kwenye kichwa cha ukurasa
    document.getElementById('agentName').textContent = decodeURIComponent(agentName);
    document.getElementById('agentAvatar').textContent = decodeURIComponent(agentName).charAt(0).toUpperCase();
    document.getElementById('propertyTitleHeader').textContent = 'Mali: ' + decodeURIComponent(propertyTitle);

    // Pakia jumbe zilizopo kutoka Supabase
    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from('chats')
        .select('*')
        .eq('agent_id', agentId)
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Hitilafu ya kupakia jumbe:', error);
        return;
      }

      const chatBox = document.getElementById('chatMessages');
      if (data && data.length > 0) {
        chatBox.innerHTML = data.map(m => `
          <div class="chat-msg ${m.sender}">
            <b>${m.sender === 'client' ? 'Wewe' : agentName}:</b> ${m.message}
          </div>
        `).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    // Tuma ujumbe mpya kwenda Supabase
    async function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const { error } = await supabaseClient.from('chats').insert([
        {
          agent_id: agentId,
          property_title: propertyTitle,
          sender: 'client',
          message: text
        }
      ]);

      if (!error) {
        input.value = '';
        loadMessages();
      } else {
        alert('Imeshindwa kutuma ujumbe: ' + error.message);
      }
    }

    // Pakia jumbe ukifungua ukurasa
    loadMessages();

    // Sikiliza kama kuna ujumbe mpya kwa wakati halisi (Realtime Subscription)
    supabaseClient
      .channel('public:chats')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats', filter: `agent_id=eq.${agentId}` }, payload => {
        loadMessages();
      })
      .subscribe();
  </script>
</body>
</html>
